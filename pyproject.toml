[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cann-claude-tools"
version = "0.1.0"
description = "CANN Ascend C operator generation tools for Claude Code"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Ping Guo"}
]
keywords = ["cann", "ascend", "npu", "claude", "operator", "code-generation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "cann-parallel-evaluator @ git+https://github.com/pgg3/CANN_Parallel_Evaluator.git",
]

[project.optional-dependencies]
mcp = ["mcp>=0.9.0"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
cann-claude = "cann_claude.cli:main"

[tool.uv.sources]
cann-parallel-evaluator = { path = "../CANN_Parallel_Evaluator", editable = true }

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cann_claude = ["templates/*"]
